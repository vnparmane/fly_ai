[project]
name = "flybrain-arcade"
version = "0.1.0"
description = "Space Invaders controller driven by a spiking model of the Drosophila brain (FlyWire connectome release 783)"
requires-python = "==3.12.*"
dependencies = [
    "brian2>=2.7",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16",
    "gymnasium>=0.29",
    "pygame>=2.5",
    "matplotlib>=3.9",
    "pyyaml>=6.0",
    "pytest>=8",
    "requests>=2.32",
    "tqdm>=4.66",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/flybrain"]
